name: 同步 Nodus 规则集

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

permissions:
  contents: write

concurrency:
  group: sync-nodus-rules
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 读取本仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: 读取上游规则和完整提交历史
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: blackmatrix7/ios_rule_script
          ref: master
          path: .upstream
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /LICENSE
            /rule/Clash/
      - name: 检查脚本语法
        run: python3 -m compileall -q scripts
      - name: 验证规则划分与上游说明同步
        run: python3 -m unittest discover -s tests -v
      - name: 增量同步、搜索补充及合并规则
        run: python3 scripts/sync.py --source .upstream --discover
      - name: 提交变更
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add -- rules/ LICENSE
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m '增量同步上游规则并合并搜索补充'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            git fetch origin main
            # 仅重置本次临时运行器 checkout，保留远程最新提交，不强推历史。
            git reset --hard origin/main
            python3 scripts/sync.py --source .upstream --discover
          done
