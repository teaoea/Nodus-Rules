name: 同步 Nodus 规则集

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

permissions:
  contents: write

concurrency:
  group: sync-nodus-rules
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 读取本仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: 读取上游规则和完整提交历史
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: blackmatrix7/ios_rule_script
          ref: master
          path: .upstream
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /LICENSE
            /rule/Clash/**/*.list
      - name: 检查脚本语法
        run: python3 -m compileall -q scripts
      - name: 增量同步、搜索补充及合并规则
        run: python3 scripts/sync.py --source .upstream --discover
      - name: 提交变更
        run: |
          git add -- rules/ LICENSE ThirdParty/ios_rule_script/LICENSE
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '增量同步上游规则并合并搜索补充'
          git push origin HEAD:main
